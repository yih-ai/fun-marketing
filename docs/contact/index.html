<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Start a Project｜FUN PROJECT</title>
  <meta name="description" content="與 FUN PROJECT 討論品牌策略、內容、社群、公關活動與品牌體驗合作。">
  <link rel="canonical" href="https://yih-ai.github.io/fun-marketing/contact/">
  <meta property="og:type" content="website"><meta property="og:title" content="Start a Project｜FUN PROJECT"><meta property="og:description" content="開始一場關於品牌策略、內容與體驗的對話。"><meta property="og:url" content="https://yih-ai.github.io/fun-marketing/contact/"><meta property="og:image" content="https://yih-ai.github.io/fun-marketing/assets/brand-cover.jpg"><meta name="twitter:card" content="summary_large_image">
  <style>
    :root { --n: #24313b; --i: #f5f1ea; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 7vw; background: var(--n); color: var(--i); font-family: Arial, "Noto Sans TC", sans-serif; }
    a { color: inherit; }
    .top { display: flex; justify-content: space-between; font: 12px monospace; letter-spacing: .1em; }
    .back { text-decoration: none; }
    .eyebrow { margin: 12vw 0 22px; color: #c6bdb1; font: 11px monospace; letter-spacing: .12em; }
    h1 { margin: 0; font: clamp(55px,9vw,130px)/.9 Georgia,serif; letter-spacing: -.06em; }
    h1 em { font-style: italic; }
    .intro { max-width: 570px; margin: 35px 0 70px; font-size: 16px; line-height: 2; }
    .form { display: grid; grid-template-columns: 1fr 1fr; gap: 25px 36px; max-width: 940px; }
    .form label { color: #c6bdb1; font: 11px monospace; letter-spacing: .09em; }
    .form input, .form select, .form textarea { display: block; width: 100%; margin-top: 10px; padding: 13px 0; border: 0; border-bottom: 1px solid #8290a0; background: transparent; color: #fff; font: 16px Arial; }
    .form option { color: #111; }
    .form textarea { height: 120px; resize: vertical; }
    .wide { grid-column: 1/-1; }
    .form button { justify-self: start; padding: 17px 22px; border: 0; background: var(--i); color: var(--n); cursor: pointer; font: 12px monospace; letter-spacing: .08em; }
    @media (max-width: 650px) { body { padding: 8vw; } .form { grid-template-columns: 1fr; } .wide { grid-column: auto; } }
  </style>
</head>
<body>
  <nav class="top"><a class="back" href="../">← FUN PROJECT</a><a href="mailto:Anya@funmkt.com">ANYA@FUNMKT.COM</a></nav>
  <main>
    <p class="eyebrow">START A PROJECT</p>
    <h1>Let's create<br>something <em>worth<br>remembering.</em></h1>
    <p class="intro">Tell us what you're building. We'll help you find the right way to make it felt. 請告訴我們你的想法與需求，我們會盡快與你聯繫。</p>
    <form class="form" action="https://formsubmit.co/Anya@funmkt.com" method="POST">
      <input type="hidden" name="_subject" value="FUN PROJECT｜新的專案洽詢">
      <input type="hidden" name="_next" value="https://yih-ai.github.io/fun-marketing/thank-you.html">
      <label>NAME *<input name="name" required></label>
      <label>COMPANY / BRAND *<input name="company" required></label>
      <label>EMAIL *<input name="email" type="email" required></label>
      <label>PHONE<input name="phone" type="tel"></label>
      <label>WHAT DO YOU NEED? *<select name="service" required><option value="" selected disabled>選擇服務</option><option>Brand Strategy</option><option>Branding</option><option>Social Media</option><option>Photography / Video</option><option>PR / Event</option><option>Campaign</option><option>Other</option></select></label>
      <label>ESTIMATED BUDGET<select name="budget"><option>尚未確定</option><option>Under NT$100K</option><option>NT$100K–300K</option><option>NT$300K–500K</option><option>NT$500K–1M</option><option>NT$1M+</option></select></label>
      <label class="wide">PROJECT GOAL *<textarea name="project_goal" required></textarea></label>
      <label class="wide">TELL US ABOUT YOUR PROJECT *<textarea name="message" required></textarea></label>
      <button class="wide" type="submit">START THE CONVERSATION ↗</button>
    </form>
  </main>
</body>
</html>
